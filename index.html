<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #stage { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; opacity:0; transition:opacity 1.4s ease; }
  #stage.on { opacity:1; }
  #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; transition:opacity .9s ease; touch-action:none; }
  #loader.off { opacity:0; pointer-events:none; }
  #dot { width:7px; height:7px; border-radius:50%; background:#fff; animation:breathe 1.5s ease-in-out infinite; }
  #tap { position:absolute; top:calc(50% + 22px); color:#777; font:300 12px/1 -apple-system,"Helvetica Neue",sans-serif; letter-spacing:.24em; text-indent:.24em; opacity:0; transition:opacity .6s ease; }
  #tap.on { opacity:1; }
  @keyframes breathe { 0%,100% { transform:scale(.7); opacity:.45; } 50% { transform:scale(1.5); opacity:1; } }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="loader"><div id="dot"></div><div id="tap">tap</div></div>

<script>
(function () {
  var W = 120, H = 260, N = 170, h = 13, FW = 270, FH = 585, BW = 640, BH = 1387, SPLAT = 58;
  var GRAB = 9, CORE = 11, REACH = 58, SNAP = 85;

  var VS_POINT = `#version 300 es
  in vec2 p; uniform vec2 dom; uniform float size;
  void main(){ gl_Position = vec4(p.x/dom.x*2.-1., 1.-p.y/dom.y*2., 0., 1.); gl_PointSize = size; }`;
  var FS_POINT = `#version 300 es
  precision highp float; out vec4 o;
  void main(){ float d = length(gl_PointCoord-.5)*2.; float a = d<1. ? (1.-d*d)*(1.-d*d) : 0.; o = vec4(a); }`;
  var VS_QUAD = `#version 300 es
  in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

  // background: white shapes that drift, turn and morph, inverting where they overlap
  var FS_BG = `#version 300 es
  precision highp float; in vec2 uv; out vec4 o; uniform float time, asp;
  mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
  float rbox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
  float poly(vec2 p, float n, float r){ float k=6.28318/n, a=atan(p.y,p.x); return cos(floor(.5+a/k)*k-a)*length(p)-r; }
  float shape(int id, vec2 p, float r){
    if (id==0) return length(p)-r;
    if (id==1) return rbox(p,vec2(r*.85),r*.12);
    if (id==2) return poly(p,3.,r*.62);
    if (id==3) return abs(length(p)-r*.78)-r*.22;
    if (id==4) return rbox(p,vec2(r*1.25,r*.32),r*.32);
    if (id==5) return poly(p,6.,r*.86);
    return min(rbox(p,vec2(r,r*.28),.004),rbox(p,vec2(r*.28,r),.004));
  }
  void main(){
    vec2 p = (uv-.5)*vec2(asp,1.);
    float v = 0.;
    for (int i=0; i<6; i++) {
      float f = float(i), t = time*(.075+f*.006)+f*1.9;
      vec2 c = vec2(sin(t*1.3+f)*asp*.37, sin(t*.9+f*2.3)*.40);
      float r = .085+.055*sin(t*.7+f*1.7)+.04*mod(f,2.);
      float ph = time*.14+f*.73;
      int a = int(mod(floor(ph)+f*2.,7.)), b = int(mod(floor(ph)+f*2.+1.,7.));
      float m = smoothstep(.25,.75,fract(ph));
      vec2 q = rot(t*.8+f)*(p-c);
      float d = mix(shape(a,q,r),shape(b,q,r),m);
      float s = smoothstep(.0012,-.0012,d);
      v = v*(1.-s)+(1.-v)*s;
    }
    o = vec4(vec3(v*.96),1.);
  }`;

  var FS_BLUR = `#version 300 es
  precision highp float; in vec2 uv; out vec4 o; uniform sampler2D F; uniform vec2 dir;
  void main(){
    float s = texture(F,uv).r*.2;
    s += (texture(F,uv+dir).r+texture(F,uv-dir).r)*.18;
    s += (texture(F,uv+dir*2.).r+texture(F,uv-dir*2.).r)*.13;
    s += (texture(F,uv+dir*3.).r+texture(F,uv-dir*3.).r)*.07;
    s += (texture(F,uv+dir*4.).r+texture(F,uv-dir*4.).r)*.02;
    o = vec4(s);
  }`;

  var FS_MAIN = `#version 300 es
  precision highp float; in vec2 uv; out vec4 o;
  uniform sampler2D F, B; uniform vec2 texel; uniform float asp;
  const float T = 1.7, WD = 5.0;
  float zf(vec2 u){ float x = clamp((texture(F,u).r-T)/WD,0.,1.); return sqrt(x*(2.-x)); }
  void main(){
    float hf = texture(F,uv).r;
    vec2 e = texel*5.;
    float dx = zf(uv+vec2(e.x,0.))-zf(uv-vec2(e.x,0.));
    float dy = zf(uv+vec2(0.,e.y))-zf(uv-vec2(0.,e.y));
    vec3 n = normalize(vec3(-dx*3.2,-dy*3.2,1.));
    vec3 r = reflect(vec3(0.,0.,-1.), n);
    float aa = max(fwidth(hf),.001), m = smoothstep(T-aa,T+aa,hf);
    float rim = 1.-n.z;
    vec3 outside = texture(B,uv).rgb;
    vec2 off = -n.xy*vec2(.17,.17*asp);
    vec3 inside = vec3(texture(B,uv+off).r, texture(B,uv+off*1.12).g, texture(B,uv+off*1.26).b)*.93;
    inside += vec3(1.)*(pow(rim,2.5)*.3+smoothstep(.5,.78,rim)*.85);
    inside += vec3(.8,.85,1.)*pow(max(dot(r,normalize(vec3(-.4,.6,.7))),0.),9.)*.13;
    float band = smoothstep(.10,.16,rim)*smoothstep(.27,.20,rim);
    float ang = smoothstep(.1,.8,dot(normalize(n.xy+1e-4),normalize(vec2(-.7,-.7))));
    inside += (.5+.5*cos(rim*42.+vec3(0.,2.1,4.2)))*band*ang*.85;
    inside += vec3(1.)*pow(max(dot(r,normalize(vec3(.45,.55,.7))),0.),120.)*.9;
    o = vec4(mix(outside,inside,m),1.);
  }`;

  var cv = document.getElementById('stage'), loader = document.getElementById('loader'), tapLabel = document.getElementById('tap');
  var gl = cv.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) { tapLabel.textContent = 'not supported'; tapLabel.classList.add('on'); return; }
  gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
  cv.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
  cv.addEventListener('webglcontextrestored', function () { location.reload(); });

  var x = new Float32Array(N), y = new Float32Array(N), px = new Float32Array(N), py = new Float32Array(N);
  var vx = new Float32Array(N), vy = new Float32Array(N), buf = new Float32Array(N * 2);
  var t = 0, split = 0, cool = 0, piece = new Int8Array(N);
  var grabbed = [], grabId = null, snapped = false, fingerX = 0, fingerY = 0, held = new Uint8Array(N);
  var tiltX = 0, tiltY = 0, softTiltX = 0, softTiltY = 0, betaRest = null, kickX = 0, kickY = 0;

  function program(vs, fs) {
    var pr = gl.createProgram();
    [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(function (s) {
      var sh = gl.createShader(s[0]);
      gl.shaderSource(sh, s[1]); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
      gl.attachShader(pr, sh);
    });
    gl.bindAttribLocation(pr, 0, 'p');
    gl.linkProgram(pr);
    return pr;
  }
  function target(internal, format, type) {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return { tex: tex, fbo: gl.createFramebuffer(), internal: internal, format: format, type: type };
  }
  function allocate(tg, w, ht) {
    gl.bindTexture(gl.TEXTURE_2D, tg.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, tg.internal, w, ht, 0, tg.format, tg.type, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, tg.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tg.tex, 0);
  }

  var pPoint = program(VS_POINT, FS_POINT), pMain = program(VS_QUAD, FS_MAIN), pBg = program(VS_QUAD, FS_BG), pBlur = program(VS_QUAD, FS_BLUR);
  var field = target(gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT), soft = target(gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT), softer = target(gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT), back = target(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
  var pointBuf = gl.createBuffer(), quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.useProgram(pMain);
  gl.uniform1i(gl.getUniformLocation(pMain, 'F'), 0);
  gl.uniform1i(gl.getUniformLocation(pMain, 'B'), 1);
  var uBgTime = gl.getUniformLocation(pBg, 'time'), uBlurDir = gl.getUniformLocation(pBlur, 'dir');

  // the world is always 120 wide; its height follows the screen so the liquid stays round
  function layout() {
    var d = Math.min(window.devicePixelRatio || 1, 2), sw = window.innerWidth, sh = window.innerHeight;
    cv.width = Math.round(sw * d); cv.height = Math.round(sh * d);
    var oldH = H;
    H = Math.max(120, Math.round(W * sh / sw));
    for (var i = 0; i < N; i++) y[i] *= H / oldH;
    FH = Math.round(FW * H / W); BH = Math.round(BW * H / W);
    allocate(field, FW, FH); allocate(soft, FW, FH); allocate(softer, FW, FH); allocate(back, BW, BH);
    gl.useProgram(pPoint);
    gl.uniform2f(gl.getUniformLocation(pPoint, 'dom'), W, H);
    gl.uniform1f(gl.getUniformLocation(pPoint, 'size'), SPLAT);
    gl.useProgram(pMain);
    gl.uniform2f(gl.getUniformLocation(pMain, 'texel'), 1 / FW, 1 / FH);
    gl.uniform1f(gl.getUniformLocation(pMain, 'asp'), W / H);
    gl.useProgram(pBg);
    gl.uniform1f(gl.getUniformLocation(pBg, 'asp'), W / H);
  }
  layout();
  window.addEventListener('resize', layout);

  for (var i0 = 0; i0 < N; i0++) {
    var a0 = Math.random() * 6.283, b0 = Math.sqrt(Math.random()) * 44;
    x[i0] = W / 2 + Math.cos(a0) * b0; y[i0] = H / 2 + Math.sin(a0) * b0;
  }

  function toWorld(e) {
    var r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
  }
  // the finger has to land on the liquid and holds only the bit under it; the rest stays free to flow and is just tugged along
  cv.addEventListener('pointerdown', function (e) {
    var p = toWorld(e), hit = false, i, dx, dy;
    for (i = 0; i < N && !hit; i++) {
      dx = x[i] - p[0]; dy = y[i] - p[1];
      hit = dx * dx + dy * dy < GRAB * GRAB;
    }
    if (!hit) return;
    grabbed = []; grabId = e.pointerId; snapped = false; held.fill(0);
    fingerX = p[0]; fingerY = p[1];
    for (i = 0; i < N; i++) {
      dx = x[i] - fingerX; dy = y[i] - fingerY;
      if (dx * dx + dy * dy < CORE * CORE) { grabbed.push({ i: i, ox: dx * .5, oy: dy * .5 }); held[i] = 1; }
    }
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', function (e) {
    if (e.pointerId !== grabId) return;
    var p = toWorld(e);
    fingerX = p[0]; fingerY = p[1];
  });
  function release(e) { if (e.pointerId === grabId) { grabbed = []; grabId = null; held.fill(0); } }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  // tilting slides the resting spot; a hard knock throws the liquid the opposite way, as inertia would
  function onOrientation(e) {
    if (e.gamma === null || e.beta === null) return;
    betaRest = betaRest === null ? e.beta : betaRest + (e.beta - betaRest) * .002;
    tiltX = Math.sin(e.gamma * Math.PI / 180);
    tiltY = Math.sin((e.beta - betaRest) * Math.PI / 180);
  }
  function onMotion(e) {
    var a = e.acceleration;
    if (!a || a.x === null || a.y === null) return;
    if (a.x * a.x + a.y * a.y < 9) return;
    kickX -= a.x * .045; kickY += a.y * .045;
  }
  function listen() {
    window.addEventListener('deviceorientation', onOrientation);
    window.addEventListener('devicemotion', onMotion);
  }
  function bang(ax, ay) { kickX += ax * 5.2; kickY += ay * 5.2; }
  window.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (d) bang(d[0], d[1]);
  });

  // a hard hit cuts the liquid into a few pieces; each stays sticky and round, and they ignore each other until they rejoin
  function tear() {
    var count = 3 + (Math.random() * 2 | 0), seeds = [], cx = 0, cy = 0, i, k;
    for (k = 0; k < count; k++) { i = Math.random() * N | 0; seeds.push([x[i], y[i]]); }
    for (i = 0; i < N; i++) {
      var best = 0, bestD = 1e9;
      for (k = 0; k < count; k++) {
        var dx = x[i] - seeds[k][0], dy = y[i] - seeds[k][1], d2 = dx * dx + dy * dy;
        if (d2 < bestD) { bestD = d2; best = k; }
      }
      piece[i] = best; cx += x[i] / N; cy += y[i] / N;
    }
    for (k = 0; k < count; k++) {
      var ox = seeds[k][0] - cx, oy = seeds[k][1] - cy, len = Math.sqrt(ox * ox + oy * oy) + .01;
      seeds[k][0] = ox / len * 2.6; seeds[k][1] = oy / len * 2.6;
    }
    for (i = 0; i < N; i++) { vx[i] += seeds[piece[i]][0]; vy[i] += seeds[piece[i]][1]; }
    split = 540;
  }

  function step() {
    t += 1 / 60;
    if (split > 0) split--;
    if (cool > 0) cool--;
    softTiltX += (tiltX - softTiltX) * .025; softTiltY += (tiltY - softTiltY) * .025;
    var kx = Math.max(-5.5, Math.min(5.5, kickX)), ky = Math.max(-5.5, Math.min(5.5, kickY));
    kickX = kickY = 0;
    var ax = W / 2 + Math.sin(t * .07) * 6 + softTiltX * 28, ay = H / 2 + Math.sin(t * .05) * 12 + softTiltY * 40, i, j, dx, dy, r2, q, r;
    for (i = 0; i < N; i++) {
      dx = ax - x[i]; dy = ay - y[i];
      var d = Math.sqrt(dx * dx + dy * dy) + .01, pull = Math.min(d * .0007, .008) * (split > 0 ? .12 : grabbed.length ? .25 : 1);
      vx[i] += kx + dx / d * pull + .004 * Math.sin(y[i] * .04 + t * .2);
      vy[i] += ky + dy / d * pull + .004 * Math.sin(x[i] * .05 - t * .15 + y[i] * .015);
    }
    // separate pieces keep a visible gap, easing off as they get ready to rejoin
    if (split > 0) {
      var apart = Math.min(1, split / 150) * .05;
      for (i = 0; i < N; i++) for (j = i + 1; j < N; j++) {
        if (piece[i] === piece[j]) continue;
        dx = x[j] - x[i]; dy = y[j] - y[i]; r2 = dx * dx + dy * dy;
        if (r2 > 900 || r2 < 1e-4) continue;
        r = Math.sqrt(r2);
        var push = (1 - r / 30) * apart / r;
        vx[i] -= dx * push; vy[i] -= dy * push; vx[j] += dx * push; vy[j] += dy * push;
      }
    }
    // sticky: neighbours drag each other along and everything loses speed fast
    for (i = 0; i < N; i++) for (j = i + 1; j < N; j++) {
      dx = x[j] - x[i]; dy = y[j] - y[i]; r2 = dx * dx + dy * dy;
      if (r2 > h * h || r2 < 1e-4 || (split > 0 && piece[i] !== piece[j])) continue;
      q = 1 - Math.sqrt(r2) / h;
      var m = q * .24, dvx = (vx[j] - vx[i]) * m, dvy = (vy[j] - vy[i]) * m;
      vx[i] += dvx; vy[i] += dvy; vx[j] -= dvx; vy[j] -= dvy;
    }
    for (i = 0; i < N; i++) {
      vx[i] *= .95; vy[i] *= .95;
      px[i] = x[i]; py[i] = y[i];
      x[i] += vx[i]; y[i] += vy[i];
    }
    for (i = 0; i < N; i++) {
      var rho = 0, near = 0;
      for (j = 0; j < N; j++) {
        if (i === j || (split > 0 && piece[i] !== piece[j])) continue;
        dx = x[j] - x[i]; dy = y[j] - y[i]; r2 = dx * dx + dy * dy;
        if (r2 > h * h) continue;
        q = 1 - Math.sqrt(r2) / h;
        rho += q * q; near += q * q * q;
      }
      var P = .05 * (rho - 3), Pn = .1 * near, sx = 0, sy = 0;
      if (P < 0) P *= 2.5;
      for (j = 0; j < N; j++) {
        if (i === j || (split > 0 && piece[i] !== piece[j])) continue;
        dx = x[j] - x[i]; dy = y[j] - y[i]; r2 = dx * dx + dy * dy;
        if (r2 > h * h || r2 < 1e-4) continue;
        r = Math.sqrt(r2); q = 1 - r / h;
        var D = (P * q + Pn * q * q) * .5 / r;
        x[j] += dx * D; y[j] += dy * D; sx -= dx * D; sy -= dy * D;
      }
      x[i] += sx; y[i] += sy;
    }
    if (grabbed.length) {
      var g, bodyX = 0, bodyY = 0;
      for (i = 0; i < N; i++) { bodyX += x[i] / N; bodyY += y[i] / N; }
      dx = fingerX - bodyX; dy = fingerY - bodyY;
      // stretched too far from the body: the strand gives way and only the bit under the finger stays on it
      if (dx * dx + dy * dy > SNAP * SNAP) snapped = true;
      if (!snapped) for (i = 0; i < N; i++) {
        if (held[i]) continue;
        dx = fingerX - x[i]; dy = fingerY - y[i];
        r = Math.sqrt(dx * dx + dy * dy) + .01;
        if (r >= REACH) continue;
        q = 1 - r / REACH;
        x[i] += dx / r * q * .03; y[i] += dy / r * q * .03;
      }
      for (g = 0; g < grabbed.length; g++) {
        var c = grabbed[g];
        x[c.i] += (fingerX + c.ox - x[c.i]) * .08;
        y[c.i] += (fingerY + c.oy - y[c.i]) * .08;
      }
    }
    var hits = 0;
    for (i = 0; i < N; i++) {
      if (x[i] < 4) { if (vx[i] < -.9) hits++; x[i] = 4; } else if (x[i] > W - 4) { if (vx[i] > .9) hits++; x[i] = W - 4; }
      if (y[i] < 4) { if (vy[i] < -.9) hits++; y[i] = 4; } else if (y[i] > H - 4) { if (vy[i] > .9) hits++; y[i] = H - 4; }
      vx[i] = Math.max(-7, Math.min(7, x[i] - px[i]));
      vy[i] = Math.max(-7, Math.min(7, y[i] - py[i]));
    }
    if (hits > 5 && cool === 0 && !grabbed.length) { tear(); cool = 240; }
  }

  function draw() {
    gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, back.fbo);
    gl.viewport(0, 0, BW, BH);
    gl.useProgram(pBg);
    gl.uniform1f(uBgTime, t * .7);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    for (var i = 0; i < N; i++) { buf[i * 2] = x[i]; buf[i * 2 + 1] = y[i]; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, field.fbo);
    gl.viewport(0, 0, FW, FH);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(pPoint);
    gl.bindBuffer(gl.ARRAY_BUFFER, pointBuf);
    gl.bufferData(gl.ARRAY_BUFFER, buf, gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, N);
    gl.disable(gl.BLEND);

    gl.useProgram(pBlur);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, soft.fbo);
    gl.bindTexture(gl.TEXTURE_2D, field.tex);
    gl.uniform2f(uBlurDir, 3 / FW, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, softer.fbo);
    gl.bindTexture(gl.TEXTURE_2D, soft.tex);
    gl.uniform2f(uBlurDir, 0, 3 / FH);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.useProgram(pMain);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, softer.tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, back.tex);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function run() {
    var last = performance.now(), acc = 0;
    (function loop(now) {
      acc = Math.min(acc + (now - last) / (1000 / 60), 3); last = now;
      while (acc >= 1) { step(); acc--; }
      draw();
      requestAnimationFrame(loop);
    })(last);
  }
  function enter() {
    cv.classList.add('on');
    loader.classList.add('off');
    setTimeout(function () { loader.remove(); }, 1000);
  }

  // iPhones only hand over the motion sensors after a tap, so the loader waits for one there
  var askFirst = window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function';
  setTimeout(function () {
    for (var i = 0; i < 200; i++) step();
    draw();
    run();
    setTimeout(function () {
      if (!askFirst) { listen(); enter(); return; }
      tapLabel.classList.add('on');
      loader.addEventListener('click', function () {
        var asks = [DeviceMotionEvent.requestPermission()];
        if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) asks.push(DeviceOrientationEvent.requestPermission());
        Promise.all(asks).then(listen).catch(function () {});
        enter();
      }, { once: true });
    }, 1200);
  }, 60);

  if (location.hash === '#debug') window.__glass = { step: step, draw: draw, bang: bang, state: function () { return { split: split, x: x, y: y, H: H, grabbed: grabbed.length }; } };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
